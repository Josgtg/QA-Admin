{% extends 'base.html' %}
{% block content %}
<h2>Crear modelo propio</h2>
<form method="post">{% csrf_token %}
{{ modelo.as_p }}
{{ metricas.management_form }}
{{ metricas.non_form_errors }}
<div id="metricas">{% for fila in metricas %}<fieldset><legend>Métrica</legend>{{ fila.as_p }}</fieldset>{% endfor %}</div>
<template id="fila"><fieldset><legend>Métrica</legend>{{ metricas.empty_form.as_p }}</fieldset></template>
<button type="button" id="agregar">Agregar métrica</button>
<button>Guardar modelo</button>
</form>
<script>
document.querySelector('#agregar').addEventListener('click', () => {
    const total = document.querySelector('#id_form-TOTAL_FORMS');
    const fila = document.querySelector('#fila').innerHTML.replaceAll('__prefix__', total.value);
    document.querySelector('#metricas').insertAdjacentHTML('beforeend', fila);
    total.value = Number(total.value) + 1;
});
</script>
{% endblock %}
