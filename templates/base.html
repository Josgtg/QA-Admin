{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QA Admin{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <symbol id="i-dashboard" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 12l4.2-4.2"/>
            <circle cx="12" cy="12" r="1.1" fill="currentColor" stroke="none"/>
        </symbol>
        <symbol id="i-projects" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <path d="M14 17.5h7M17.5 14v7"/>
        </symbol>
        <symbol id="i-metrics" viewBox="0 0 24 24">
            <path d="M3 20h18"/>
            <path d="M3 20V6"/>
            <path d="M5 16l4-5 3 3 5-7 4 2"/>
        </symbol>
        <symbol id="i-techniques" viewBox="0 0 24 24">
            <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/>
            <circle cx="12" cy="12" r="3.5"/>
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-3.5-3.5"/>
        </symbol>
        <symbol id="i-plus" viewBox="0 0 24 24">
            <path d="M12 5v14M5 12h14"/>
        </symbol>
        <symbol id="i-edit" viewBox="0 0 24 24">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </symbol>
        <symbol id="i-tasks" viewBox="0 0 24 24">
            <path d="M9 5h10M9 12h10M9 19h10"/>
            <path d="M4 5l1 1 2-2M4 12l1 1 2-2M4 19l1 1 2-2"/>
        </symbol>
        <symbol id="i-settings" viewBox="0 0 24 24">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
        </symbol>
        <symbol id="i-eye" viewBox="0 0 24 24">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
            <circle cx="12" cy="12" r="3"/>
        </symbol>
        <symbol id="i-link" viewBox="0 0 24 24">
            <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
            <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
        </symbol>
        <symbol id="i-clock" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 7v5l3 2"/>
        </symbol>
        <symbol id="i-check-circle" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M8 12.5l2.5 2.5L16 9.5"/>
        </symbol>
        <symbol id="i-alert-circle" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 8v5M12 16h.01"/>
        </symbol>
        <symbol id="i-filter" viewBox="0 0 24 24">
            <path d="M3 5h18l-7 8v5l-4 2v-7Z"/>
        </symbol>
        <symbol id="i-group" viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/>
            <rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/>
            <rect x="14" y="14" width="7" height="7" rx="1.5"/>
        </symbol>
        <symbol id="i-download" viewBox="0 0 24 24">
            <path d="M12 3v12"/>
            <path d="M7 10l5 5 5-5"/>
            <path d="M4 20h16"/>
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/>
            <path d="M14 3v5h5"/>
            <path d="M9 13h6M9 17h6"/>
        </symbol>
        <symbol id="i-clipboard" viewBox="0 0 24 24">
            <rect x="5" y="4" width="14" height="17" rx="2"/>
            <path d="M9 4V3h6v1"/>
            <path d="M8.5 10h7M8.5 14h7M8.5 18h4"/>
        </symbol>
        <symbol id="i-list-check" viewBox="0 0 24 24">
            <path d="M10 6h10M10 12h10M10 18h10"/>
            <path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/>
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        </symbol>
        <symbol id="i-pencil" viewBox="0 0 24 24">
            <path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16Z"/>
            <path d="M13.5 6.5l4 4"/>
        </symbol>
        <symbol id="i-shield" viewBox="0 0 24 24">
            <path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6Z"/>
            <path d="M9 12l2 2 4-4"/>
        </symbol>
        <symbol id="i-code" viewBox="0 0 24 24">
            <path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>
        </symbol>
        <symbol id="i-layers" viewBox="0 0 24 24">
            <path d="M12 3l9 5-9 5-9-5Z"/>
            <path d="M3 13l9 5 9-5"/>
        </symbol>
        <symbol id="i-sparkle" viewBox="0 0 24 24">
            <path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8Z"/>
        </symbol>
        <symbol id="i-trash" viewBox="0 0 24 24">
            <path d="M4 7h16"/>
            <path d="M10 11v6M14 11v6"/>
            <path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>
            <path d="M9 7V4h6v3"/>
        </symbol>
    </svg>

    <div class="layout">
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a class="nav-link {% if request.resolver_match.url_name == 'tablero' %}active{% endif %}" href="{% url 'inicio' %}">
                    <svg class="icon"><use href="#i-dashboard"></use></svg>
                    <span>Dashboard Principal</span>
                </a>
                <a class="nav-link {% if request.resolver_match.app_name == 'reportes' and request.resolver_match.url_name != 'tablero' %}active{% endif %}" href="{% url 'reportes:lista' %}">
                    <svg class="icon"><use href="#i-projects"></use></svg>
                    <span>Registro de Proyectos</span>
                </a>
                <a class="nav-link {% if request.path == '/metricas/' %}active{% endif %}" href="/metricas/">
                    <svg class="icon"><use href="#i-metrics"></use></svg>
                    <span>Seguimiento de Métricas</span>
                </a>
                <a class="nav-link {% if request.path == '/tecnicas/' %}active{% endif %}" href="/tecnicas/">
                    <svg class="icon"><use href="#i-techniques"></use></svg>
                    <span>Gestión de Técnicas QA</span>
                </a>
            </nav>
        </aside>

        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
